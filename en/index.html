  <style>
    :root{
      --red:#d52b1e;
      --red-dark:#a82017;
      --red-soft:#fff1ef;
      --ink:#17212b;
      --muted:#687683;
      --line:#e2e7e4;
      --bg:#f5f7f4;
      --surface:#ffffff;
      --surface-soft:#f9faf8;
      --navy:#17324d;
      --green:#18715c;
      --green-soft:#e9f5f0;
      --amber:#9a650f;
      --amber-soft:#fff6df;
      --danger:#a12626;
      --shadow:0 20px 60px rgba(23,50,77,.09);
      --shadow-sm:0 10px 30px rgba(23,50,77,.07);
      --radius-xl:28px;
      --radius-lg:20px;
      --radius-md:14px;
      --max:1240px;
    }

    *{box-sizing:border-box}
    html{scroll-behavior:smooth}
    body{
      margin:0;
      color:var(--ink);
      background:
        radial-gradient(circle at 10% 0%, rgba(213,43,30,.08), transparent 28%),
        radial-gradient(circle at 95% 12%, rgba(23,50,77,.08), transparent 26%),
        var(--bg);
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
      font-size:15px;
      line-height:1.65;
    }
    body[data-mode="plan"] .simple-only,
    body[data-mode="plan"] .manual-only,
    body[data-mode="plan"] .compare-shell{display:none!important}
    body[data-mode="simple"] .plan-only,
    body[data-mode="simple"] .manual-only,
    body[data-mode="simple"] .manual-route-fields{display:none!important}
    body[data-mode="manual"] .plan-only,
    body[data-mode="manual"] .simple-only{display:none!important}
    button,input,select{font:inherit}
    button,a,input,select,summary{outline-offset:3px}
    button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible{outline:3px solid rgba(213,43,30,.24)}
    a{color:inherit;text-decoration:none}
    h1,h2,h3,p{margin-top:0}
    h1{font-size:clamp(34px,5vw,62px);line-height:1.12;letter-spacing:-.045em;margin-bottom:20px}
    h2{font-size:clamp(25px,3vw,38px);line-height:1.22;letter-spacing:-.035em;margin-bottom:12px}
    h3{font-size:18px;line-height:1.4;letter-spacing:-.015em;margin-bottom:8px}
    ul{padding-left:20px}
    label{cursor:pointer}
    [hidden]{display:none!important}

    .skip-link{position:fixed;left:16px;top:-60px;z-index:9999;padding:11px 16px;border-radius:12px;background:var(--ink);color:#fff;font-weight:900}
    .skip-link:focus{top:16px}
    .site-header{position:sticky;top:0;z-index:1000;border-bottom:1px solid rgba(226,231,228,.9);background:rgba(255,255,255,.86);backdrop-filter:blur(18px)}
    .header-inner{max-width:var(--max);margin:0 auto;padding:13px 18px;display:flex;align-items:center;justify-content:space-between;gap:20px}
    .brand{display:flex;align-items:center;gap:11px;font-weight:950;letter-spacing:-.025em}
    .brand-mark{width:37px;height:37px;border-radius:12px;background:var(--red);color:#fff;display:grid;place-items:center;font-size:23px;box-shadow:0 8px 20px rgba(213,43,30,.22)}
    .brand-logo-wrap{width:42px;height:42px;border-radius:13px;overflow:hidden;display:grid;place-items:center;background:#fff;box-shadow:0 8px 22px rgba(23,50,77,.15);border:1px solid rgba(226,231,228,.95);flex:none}
    .brand-logo{width:100%;height:100%;object-fit:cover;display:block}
    .simple-route-note{margin-top:10px;padding:9px 11px;border-radius:12px;background:var(--green-soft);color:var(--green);font-size:12px;font-weight:850}
    .auto-condition{margin-top:12px;padding:12px;border:1px solid #dce7e2;border-radius:15px;background:#f7fbf9}
    .auto-condition label{display:flex;flex-direction:column;gap:6px}
    .score-help{font-size:12px;color:var(--muted);margin-top:5px}
    .comparison-score{font-size:14px;color:var(--green);font-weight:950}
    .brand-copy{display:flex;flex-direction:column;line-height:1.1}
    .brand-copy small{margin-top:5px;color:var(--muted);font-size:10px;letter-spacing:.12em;font-weight:800}
    .header-nav{display:flex;align-items:center;gap:7px}
    .header-nav a{padding:9px 11px;border-radius:11px;color:#475563;font-weight:800;font-size:13px}
    .header-nav a:hover{background:#f1f3f1;color:var(--ink)}
    .header-nav .nav-cta{background:var(--ink);color:#fff;padding-inline:15px}
    .header-nav .nav-cta:hover{background:var(--navy);color:#fff}

    .hero{max-width:var(--max);margin:0 auto;padding:78px 18px 50px;display:grid;grid-template-columns:minmax(0,1.15fr) minmax(330px,.85fr);gap:48px;align-items:center}
    .eyebrow{display:inline-flex;align-items:center;gap:8px;margin:0 0 16px;color:var(--red);font-size:12px;font-weight:950;letter-spacing:.13em;text-transform:uppercase}
    .eyebrow:before{content:"";width:28px;height:2px;background:currentColor;border-radius:9px}
    .hero-copy>p{max-width:650px;color:#556471;font-size:18px;line-height:1.75}
    .hero-actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:28px}
    .hero-meta{display:flex;flex-wrap:wrap;gap:13px;margin-top:22px;color:var(--muted);font-size:12px;font-weight:800}
    .hero-meta span{display:inline-flex;align-items:center;gap:6px}
    .hero-meta span:before{content:"âœ“";color:var(--green);font-weight:950}
    .hero-visual{min-height:420px;position:relative;border-radius:32px;overflow:hidden;background:linear-gradient(145deg,#17324d 0%,#224a67 48%,#d52b1e 140%);box-shadow:0 32px 80px rgba(23,50,77,.23)}
    .hero-visual:before{content:"";position:absolute;inset:auto -15% -22% -15%;height:75%;background:#f7faf8;clip-path:polygon(0 100%,0 72%,13% 53%,27% 72%,47% 28%,61% 56%,74% 38%,100% 72%,100% 100%)}
    .hero-visual:after{content:"";position:absolute;inset:auto -10% -12% -10%;height:52%;background:#dfe8e5;opacity:.86;clip-path:polygon(0 100%,0 80%,18% 45%,30% 74%,49% 38%,65% 78%,82% 52%,100% 76%,100% 100%)}
    .visual-sun{position:absolute;width:84px;height:84px;right:54px;top:50px;border-radius:50%;background:#fff5dc;box-shadow:0 0 55px rgba(255,245,220,.55)}
    .visual-train{position:absolute;z-index:3;left:42px;right:42px;bottom:40px;padding:19px 20px;border:1px solid rgba(255,255,255,.52);border-radius:20px;background:rgba(255,255,255,.9);box-shadow:var(--shadow-sm)}
    .visual-train-top{display:flex;justify-content:space-between;gap:12px;align-items:center}
    .visual-train b{font-size:18px;letter-spacing:-.02em}
    .visual-route{display:flex;align-items:center;gap:9px;margin-top:13px;color:var(--muted);font-size:12px;font-weight:800}
    .visual-route i{height:2px;flex:1;background:linear-gradient(90deg,var(--red),var(--navy));border-radius:10px}
    .visual-price{margin-top:14px;display:flex;align-items:end;justify-content:space-between;gap:12px}
    .visual-price strong{font-size:29px;line-height:1;color:var(--navy)}
    .visual-price span{font-size:12px;color:var(--green);font-weight:900;background:var(--green-soft);padding:5px 9px;border-radius:999px}

    .trust-wrap{max-width:var(--max);margin:0 auto;padding:0 18px 34px}
    .trust-strip{display:grid;grid-template-columns:repeat(3,1fr);border:1px solid var(--line);border-radius:20px;background:rgba(255,255,255,.78);box-shadow:var(--shadow-sm);overflow:hidden}
    .trust-item{padding:20px 22px;display:flex;align-items:center;gap:13px;border-right:1px solid var(--line)}
    .trust-item:last-child{border-right:none}
    .trust-icon{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;background:var(--red-soft);font-size:20px}
    .trust-item b{display:block;font-size:14px}
    .trust-item small{display:block;margin-top:2px;color:var(--muted);font-size:11px}

    .section-shell{max-width:var(--max);margin:0 auto;padding:54px 18px}
    .section-heading{display:flex;justify-content:space-between;gap:24px;align-items:end;margin-bottom:24px}
    .section-heading p{margin:0;color:var(--muted);max-width:660px}
    .mode-tabs{display:inline-flex;gap:5px;padding:5px;border:1px solid var(--line);border-radius:14px;background:#eef1ef}
    .mode-tab{border:0;border-radius:10px;padding:10px 14px;background:transparent;color:#667581;cursor:pointer;font-weight:900;font-size:13px}
    .mode-tab.active{background:#fff;color:var(--ink);box-shadow:0 3px 12px rgba(23,50,77,.09)}

    .calculator-grid{display:grid;grid-template-columns:390px minmax(0,1fr);gap:18px;align-items:start}
    .panel,.card{border:1px solid var(--line);border-radius:var(--radius-lg);background:var(--surface);box-shadow:var(--shadow-sm)}
    .panel{padding:18px}
    .sticky{position:sticky;top:82px}
    .panel-title{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}
    .panel-title h3{margin:0}
    .step-badge{display:inline-flex;align-items:center;justify-content:center;min-width:30px;height:30px;border-radius:10px;background:var(--red-soft);color:var(--red);font-size:12px;font-weight:950}
    .col{display:flex;flex-direction:column;gap:12px}
    .subCard{padding:15px;border:1px solid var(--line);border-radius:16px;background:var(--surface-soft)}
    .subCard+.subCard{margin-top:0}
    .subCard .section-mini-title{display:flex;align-items:center;gap:9px;font-weight:950;margin-bottom:4px}
    .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
    .grid2>label{display:flex;flex-direction:column;gap:6px;font-weight:800;font-size:12px;color:#465461}
    .grid2>label span{display:flex;justify-content:space-between;gap:8px}
    input[type="number"],input[type="date"],input[type="text"],select{
      width:100%;min-height:43px;padding:10px 11px;border:1px solid #d8dfdc;border-radius:12px;background:#fff;color:var(--ink);transition:border-color .15s,box-shadow .15s
    }
    input:hover,select:hover{border-color:#bfc9c5}
    input:focus,select:focus{border-color:var(--red);box-shadow:0 0 0 4px rgba(213,43,30,.08)}
    input[disabled]{background:#eef1ef;color:#95a09b}
    input[type="checkbox"],input[type="radio"]{accent-color:var(--red)}

    .muted{color:var(--muted);font-size:12px}
    .small{font-size:13px}
    .mini{font-size:11.5px;color:var(--muted)}
    .k{font-weight:950}
    .big{font-size:31px;font-weight:950;line-height:1.15;letter-spacing:-.035em}
    .row{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
    .btnRow,.actionBtns,.topControls,.copyBtns{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
    .hr{border-top:1px solid var(--line);margin:14px 0}
    .btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:41px;padding:9px 13px;border:1px solid var(--line);border-radius:12px;background:#fff;color:var(--ink);cursor:pointer;font-weight:900;font-size:13px;transition:transform .15s,box-shadow .15s,border-color .15s,background .15s}
    .btn:hover{transform:translateY(-1px);border-color:#c9d0cd;box-shadow:0 7px 18px rgba(23,50,77,.08)}
    .btn-primary{border-color:var(--red);background:var(--red);color:#fff;padding-inline:18px}
    .btn-primary:hover{background:var(--red-dark);border-color:var(--red-dark)}
    .btn-dark{background:var(--ink);border-color:var(--ink);color:#fff;padding-inline:18px}
    .btn-ghost{background:rgba(255,255,255,.72)}
    .danger{border-color:#f3c8c8;background:#fff5f5;color:var(--danger)}
    .icon-button{width:41px;padding:0}

    details{border:1px solid var(--line);border-radius:14px;padding:12px;background:#fff}
    details[open]{border-color:#d3dad7}
    summary{cursor:pointer;font-weight:900;list-style:none}
    summary::-webkit-details-marker{display:none}
    details>summary:after{content:"ï¼‹";float:right;color:var(--muted);font-weight:500}
    details[open]>summary:after{content:"âˆ’"}
    .nested{margin:10px 0 0 8px;padding:2px 0 0 13px;border-left:2px solid #edf0ee;display:flex;flex-direction:column;gap:9px}
    .pass-stack{display:flex;flex-direction:column;gap:8px;margin-top:11px}
    .pass-stack details{background:#fff}

    .statusBox{display:none;margin-top:9px;padding:10px 12px;border:1px solid #f1d28e;border-radius:12px;background:var(--amber-soft);color:var(--amber);font-weight:800;font-size:12px}
    .disabled{opacity:.55;pointer-events:none;filter:grayscale(.2)}
    .warnText{color:var(--amber);font-weight:900}
    .familyHint{margin-top:6px;font-size:12px;color:var(--green);font-weight:900}
    .toggleRow{display:flex;align-items:center;gap:7px;flex-wrap:wrap}
    .routeCount{font-size:12px;color:var(--muted);font-weight:900;padding:6px 9px;border-radius:999px;background:#f0f3f1}
    .copyBtns{margin-top:10px}
